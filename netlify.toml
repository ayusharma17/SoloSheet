[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Increase timeout for API routes (extraction can take time)
  # Free tier: max 10s, Pro tier: max 26s
  node_bundler = "esbuild"

# Optimize for Next.js App Router
[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
