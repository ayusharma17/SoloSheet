[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Long-running generation is configured as a Background Function in code.
  node_bundler = "esbuild"

# Optimize for Next.js App Router
[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
